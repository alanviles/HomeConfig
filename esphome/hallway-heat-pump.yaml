# Board: ESP32 Pico Kit
# Definition: definitions/boards/pico32/manifest.yaml

esphome:
    name: hallway-heat-pump
    friendly_name: Hallway Heat Pump

esp32:
    board: pico32
    framework:
        type: esp-idf

logger:
    baud_rate: 0
    level: DEBUG

api:
    encryption:
        key: !secret hallway_heat_pump__encryption_key
ota:
    - platform: esphome
      encryption:

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    ap:
        ssid: Hallway HP Fallback Hotspot
        password: !secret hallway_heat_pump__ap_password
captive_portal:

external_components:
    - source: github://echavet/MitsubishiCN105ESPHome

uart:
    id: HP_UART
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    tx_pin: 33
    rx_pin: 32
substitutions:
    entity_prefix: Hallway Heat Pump
climate:
    - platform: cn105
      name: ${entity_prefix}
      icon: mdi:heat-pump
      id: hp
      visual:
          min_temperature: 15
          max_temperature: 31
          temperature_step:
              target_temperature: 1
              current_temperature: 0.1
      outside_air_temperature_sensor:
          name: ${entity_prefix} Outside Air Temperature
      vertical_vane_select:
          name: ${entity_prefix} Vertical Vane
      horizontal_vane_select:
          name: ${entity_prefix} Horizontal Vane
      input_power_sensor:
          name: ${entity_prefix} Input Power
          disabled_by_default: true
      kwh_sensor:
          name: ${entity_prefix} Energy
          disabled_by_default: true
      remote_temperature_timeout: 30min
      debounce_delay: 500ms
      update_interval: 2s

sensor:
    - platform: template
      name: ${entity_prefix} Inside Temperature
      id: hp_internal_temp
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
      update_interval: 10s
      lambda: |-
          float t = id(hp).current_temperature;
          if (isnan(t)) {
            return {};
          }
          return t;
    - platform: wifi_signal
      name: WiFi Signal Sensor
      id: sensor_wifi_signal_1

bluetooth_proxy:

button:
    - platform: restart
      name: Restart Button
      id: button_restart_1
